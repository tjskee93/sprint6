<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <!-- Отображение ошибки -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-success">Корзина</span>
                </h2>
                <span class="badge bg-info me-2">
                        Привет, <span th:text="${username}"></span>!
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-secondary bi bi-box-arrow-right"> Выйти</button>
                </form>
                <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
                <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
            </div>
        </div>
    </div>

    <div class="row p-2" th:each="item : ${items}">
        <div class="col">
            <div class="card">
                <img class="p-2" th:src="${'/'+item.imgPath()}" alt="Нет изображения" width="300" height="300">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.title()}"></h5>
                    <h5>
                        <span class="badge text-bg-success justify-content-end" th:text="${item.price()}+' руб.'"></span>
                    </h5>
                    <p class="card-text" th:text="${item.description()}"></p>
                    <form th:action="@{/cart/items}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="hstack gap-3">
                            <input type="hidden" name="id" th:value="${item.id()}">
                            <button type="submit" class="btn btn-outline-secondary" name="action" value="MINUS">-</button>
                            <span th:text="${item.count()}"></span>
                            <button type="submit" class="btn btn-outline-secondary" name="action" value="PLUS">+</button>
                            <button type="submit" class="btn btn-danger ms-auto bi bi-trash" name="action" value="DELETE"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2 th:text="'Итого: '+${total}+' руб.'"/>
                <span th:if="${paymentAvailable}" class="badge bg-info" th:text="'Баланс: '+${balance}+' руб.'"/>
                <span th:unless="${paymentAvailable}" class="badge bg-danger">Сервис платежей недоступен</span>
            </div>

            <div class="mt-3">
                <form action="/buy" method="post" th:if="${!items.isEmpty() && canBuy && paymentAvailable}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-warning">Купить</button>
                </form>

                <div th:if="${!items.isEmpty() && (!canBuy || !paymentAvailable)}" class="alert alert-warning">
                    <span th:if="${!paymentAvailable}">Сервис платежей недоступен. Оплата невозможна.</span>
                    <span th:if="${paymentAvailable && !canBuy}">Недостаточно средств для покупки. Необходимо: <span th:text="${total}"/> руб., доступно: <span th:text="${balance}"/> руб.</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>

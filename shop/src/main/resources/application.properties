spring.application.name=my-market-app

# Connection Pool
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resources
spring.webflux.static-path-pattern=/**
spring.webflux.static-locations=classpath:/static/

# Encoding
server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

app.cache.item-ttl=5
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=my-market:cache:

# Payment service
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}

# Logging
logging.level.ru.yandex.practicum.mymarket=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.ru.yandex.practicum.mymarket.service.ItemCacheService=DEBUG
logging.level.ru.yandex.practicum.mymarket.service.ItemService=DEBUG
logging.level.org.springframework.data.redis=DEBUG